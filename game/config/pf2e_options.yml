---
pf2e:
  achievements:
    dungeon_keeper:
      type: community
      message: Ran %{count} Player-Run Plots.
      levels:
        - 1
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
    master_of_meetups:
      type: community
      message: Ran %{count} Meetups.
      levels:
        - 1
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
  shortcuts:
    sheet/top: sheet/info
    rollalias: roll/alias
    remalias: roll/alias
    listalias: roll/listalias
    rollfor: roll/for
    csheet: sheet/combat
    # `formulas` with no switch is the list; there is no `formulas/list` to point at.
    formulalist: formulas
    boog: boost # Just for Whirlpool
    tinit: encounter/view
    pinit: encounter/prev
    ninit: encounter/next
    rminit: encounter/remove
    tscan: encounter/scan
    jinit: encounter/add
    modinit: encounter/mod
    resume: encounter/end
    # A chargen pick answers to `cg` as well as to the root it has always had, so a player who has
    # learned `cg/review` can reach the rest of the stage from the same word - the way every
    # advancement pick is a switch of `advance`. The older spellings still work.
    cg/boost: boost/set
    cg/unboost: boost/unset
    cg/skill: skill/set
    cg/unskill: skill/unset
    cg/language: lang/set
    cg/unlanguage: lang/unset
    cg/lang: lang/set
    cg/unlang: lang/unset
    cg/commit: commit
    cg/font: dfont
    # A level can owe a divine font too, and `advance/review` lists it: the command that fills it
    # answers to `advance` as well.
    advance/font: dfont
  max_level: 20
  # Turns on the playtest's self-service commands: selfaward/xp, selfaward/gold and selfapprove. Set
  # false on a live game, where staff award XP and approve characters.
  playtest: true
  # What selfaward/gold pays, by level, in gp: GM Core's lump sum for a new character (Treasure for
  # New Characters, pg. 61). The starting money every character already holds comes off it.
  playtest_wealth:
    1: 15
    2: 30
    3: 75
    4: 140
    5: 270
    6: 450
    7: 720
    8: 1100
    9: 1600
    10: 2300
    11: 3200
    12: 4500
    13: 6400
    14: 9300
    15: 13500
    16: 20000
    17: 30000
    18: 45000
    19: 69000
    20: 112000
  # Hero Points, which are a scene's: what each player character starts a scene with, the most one may
  # hold, and what one costs in RPP.
  hero_points:
    start: 1
    most: 3
    rpp_cost: 3
  allowed_alignments:
    - OL
    - BL
    - WL
    - OT
    - BT
    - WT
  roll_channel: 'Rolls'
  # Put before the lines the game tells - a Strike, a spell, damage, a public roll - so players can tell
  # them from a pose. Blank for none. Each player picks how much of it they see with `rollprefix`:
  # `all`, `actions` or `off`. `system_prefix_level` is the level for a player who has not picked one,
  # and for the logs a finished scene keeps.
  system_prefix: '[PF]'
  system_prefix_level: actions
  # The job category a creature submitted for approval is discussed in. Left out, the game's request
  # category; blank, no job.
  creature_approval_category: REQ
  can_select_language:
    - common
    - uncommon
  open_sheets: true
  open_npc_sheets: false
  title_color: '%x172'
  list_item: '%x229'
  use_alignment: true
  subclass_names:
    Alchemist: 'Research Field'
    Barbarian: 'Instinct'
    Bard: 'Muse'
    Champion: 'Cause'
    Druid: 'Order'
    Ranger: "Hunter's Edge"
    Rogue: 'Racket'
    Sorcerer: 'Bloodline'
    Wizard: 'Arcane School'
    Investigator: 'Methodology'
    Swashbuckler: 'Style'
    Oracle: 'Mystery'
    Witch: 'Patron'
  condition_colors:
    Dying: '%xr'
    Wounded: '%xy'
    Drained: '%xh%xx'
    Doomed: '%x172'
  hidden_options:
    - Fey Bullshit Lore
  # The lore groups skills/lore will list. Only these are valid, not every lore_groups tag in
  # pf2e_skills.yml. A group with sections is shown split by those tags, in the order written,
  # under the heading given for each. sections_per_page pages a long group by whole sections.
  # name is how the group is shown; without one, the key is shown capitalized.
  lore_group_lists:
    ancestry:
      aliases: [heritage]
    city:
      sections_per_page: 5
      sections:
        am'shere: Am'shere
        bludgun: Bludgun
        charn: Charn
        dran: Dran
        jade islands: Jade Islands
        khazad duin: Khazad Duin
        kimitatu: Kimitatu
        myrddion: Myrddion
        periantha: Periantha
        rune: Rune
        skyhaldborg: Skyhaldborg
        the desolation: The Desolation
        the heartlands: The Heartlands
        tysmycha: Tysmycha
        veyshan: Veyshan
    craft:
      name: Crafting
      aliases: [crafting]
    creature: {}
    deity: {}
    general:
      aliases: [profession]
    planar:
      aliases: [planes]
      sections:
        light plane: Light Planes
        twilight plane: Twilight Planes
        shadow plane: Shadow Planes
    region: {}
    terrain: {}
  # The bestiaries whose creatures anyone may add to an encounter they run. A Plotmaster and staff
  # add any creature.
  event_runner_bestiaries:
    - pathfinder-monster-core
    - pathfinder-monster-core-2
  permissions:
    modify_sheet: Modify character sheets.
    view_sheets: View other people's character sheets (if sheets are closed).
    kill_pc: (Plotmaster) Runs encounters with any creature, one of their own making among them, which may leave a character Drained, Doomed or dead.
    trusted_gm: (Set by an admin) Gives characters items in an encounter they run, with +e/loot.
  prof_progression:
    - untrained
    - trained
    - expert
    - master
    - legendary
  min_level_for_prof: 
    - 1
    - 1
    - 1
    - 7
    - 15
  valid_feat_types:
    - ancestry
    - charclass
    - skill
    - general
    - archetype
    - dedication
