---
pf2e:
  achievements:
    dungeon_keeper:
      type: community
      message: Ran %{count} Player-Run Plots.
      levels:
        - 1
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
    master_of_meetups:
      type: community
      message: Ran %{count} Meetups.
      levels:
        - 1
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
  shortcuts:
    sheet/top: sheet/info
    rollalias: roll/alias
    remalias: roll/alias
    listalias: roll/listalias
    rollfor: roll/for
    csheet: sheet/combat
    # `formulas` with no switch is the list; there is no `formulas/list` to point at.
    formulalist: formulas
    boog: boost # Just for Whirlpool
    tinit: encounter/view
    pinit: encounter/prev
    ninit: encounter/next
    rminit: encounter/remove
    tscan: encounter/scan
    jinit: encounter/add
    modinit: encounter/mod
    resume: encounter/end
    # A chargen pick answers to `cg` as well as to the root it has always had, so a player who has
    # learned `cg/review` can reach the rest of the stage from the same word - the way every
    # advancement pick is a switch of `advance`. The older spellings still work.
    cg/boost: boost/set
    cg/unboost: boost/unset
    cg/skill: skill/set
    cg/unskill: skill/unset
    cg/language: lang/set
    cg/unlanguage: lang/unset
    cg/lang: lang/set
    cg/unlang: lang/unset
    cg/commit: commit
    cg/font: dfont
    # A level can owe a divine font too, and `advance/review` lists it: the command that fills it
    # answers to `advance` as well.
    advance/font: dfont
  max_level: 20
  allowed_alignments:
    - OL
    - BL
    - WL
    - OT
    - BT
    - WT
  roll_channel: 'Rolls'
  can_select_language:
    - common
    - uncommon
  open_sheets: true
  open_npc_sheets: false
  title_color: '%x172'
  list_item: '%x229'
  use_alignment: true
  subclass_names:
    Alchemist: 'Research Field'
    Barbarian: 'Instinct'
    Bard: 'Muse'
    Champion: 'Cause'
    Druid: 'Order'
    Ranger: "Hunter's Edge"
    Rogue: 'Racket'
    Sorcerer: 'Bloodline'
    Wizard: 'Thesis'
    Investigator: 'Methodology'
    Swashbuckler: 'Style'
    Oracle: 'Mystery'
    Witch: 'Patron'
  condition_colors:
    Dying: '%xr'
    Wounded: '%xy'
    Drained: '%xh%xx'
    Doomed: '%x172'
  hidden_options:
    - Fey Bullshit Lore
  permissions:
    modify_sheet: Modify character sheets.
    view_sheets: View other people's character sheets (if sheets are closed).
    kill_pc: (Associated to DM role) Has the ability to inflict Drained, Doomed, and Dead conditions on PC's.
  prof_progression:
    - untrained
    - trained
    - expert
    - master
    - legendary
  min_level_for_prof: 
    - 1
    - 1
    - 1
    - 7
    - 15
  valid_feat_types:
    - ancestry
    - charclass
    - skill
    - general
    - archetype
    - dedication
  daily_prep_cron:
    hour: 
      - 10
    minute:
      - 03
