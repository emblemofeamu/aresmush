      edicts:
      - Follow the law.
      - Respect legitimate authorities or leadership.
      initial_dedication: {}
    Redeemer:
      allowed_sanctifications:
      - Holy
      allowed_alignments:
      - OL
      edicts:
      - Try to redeem those who commit wicked deeds.
      - Show compassion to others regardless of their authority or station.
      anathema:
      - Kill a sapient enemy without first offering a chance at redemption.
      initial_dedication: {}
    Liberator:
      allowed_alignments:
      - WL
      - WT
      edicts:
      - Oppose slavery and tyranny.
      - Fight for others' freedom to make their own decisions.
      - Respect choices others make for their own lives.
      anathema:
      - Engage in slavery or tyranny.
      - Force or threaten someone to act a certain way.
      initial_dedication: {}
