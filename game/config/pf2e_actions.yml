  "Recall Knowledge":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "secret"]
    check: {"slug": "recall-knowledge", "statistic": ["arcana", "crafting", "medicine", "nature", "occultism", "religion", "society"], "options": ["action:recall-knowledge"], "notes": {"criticalSuccess": "You recall the knowledge accurately. The GM answers your question truthfully and either tells you additional information or context, or answers one follow-up question.", "success": "You recall the knowledge accurately. The GM answers your question truthfully.", "criticalFailure": "You recall incorrect information. The GM answers your question falsely (or decides to give you no information, as on a failure)."}}
    description: "You attempt a skill check to try to remember a bit of knowledge regarding a topic related to that skill. Suggest which skill you'd like to use and ask the GM one question. The GM determines the DC. You might need to collaborate with the GM to narrow down the question or skills, and you can decide not to Recall Knowledge before committing to the action if you don't like your options.%rCritical Success You recall the knowledge accurately. The GM answers your question truthfully and either tells you additional information or context, or answers one follow-up question.%rSuccess You recall the knowledge accurately. The GM answers your question truthfully.%rCritical Failure You recall incorrect information. The GM answers your question falsely (or decides to give you no information, as on a failure)."
