    check: {"slug": "shove", "statistic": "athletics", "options": ["action:shove", "forced-movement"], "against": "fortitude", "weapon_traits": ["shove"], "notes": {"criticalSuccess": "You push your target up to 10 feet away from you. You can Stride after it, but you must move the same distance and in the same direction.", "success": "You push your target back 5 feet. You can Stride after it, but you must move the same distance and in the same direction.", "criticalFailure": "You lose your balance, fall, and land Prone."}}
