    type: "passive"
    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You seek out rumors about the infiltration's target. Attempt a normal, hard, or very hard Diplomacy check.%rCritical Success You gain inside information about the location or group you're trying to infiltrate. This grants you a +2 circumstance bonus to future checks you attempt for preparation activities for this infiltration. If you share this information, those you share it with also gain this bonus.%rSuccess You gain inside information about the place or group you're attempting to infiltrate that aids your planning.%rFailure You learn nothing.%rCritical Failure You hear a few mistaken rumors and take a -2 circumstance penalty to your next check for a preparation activity. Word spreads around that you're asking after that group or individual, increasing your Awareness Points by 1."
  "Grab an Edge":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "reaction"
    category: "interaction"
    traits: ["manipulate"]
    check: {"slug": "grab-an-edge", "statistic": ["reflex", "acrobatics"], "options": ["action:grab-an-edge"], "notes": {"criticalSuccess": "You grab the edge or handhold, whether or not you have a hand free, typically by using a suitable held item to catch yourself (catching a battle axe on a ledge, for example). You still take damage from the distance fallen so far, but you treat the fall as though it were 30 feet shorter.", "success": "If you have at least one hand free, you grab the edge or handhold, stopping your fall. You still take damage from the distance fallen so far, but you treat the fall as though it were 20 feet shorter. If you have no hands free, you continue to fall as if you had failed the check.", "criticalFailure": "You continue to fall, and if you've fallen 20 feet or more before you use this reaction, you take 10 bludgeoning damage from the impact for every 20 feet fallen."}}
    description: "Trigger You fall from or past an edge or handhold.%rRequirements Your hands are not tied behind your back or otherwise restrained.%rWhen you fall off or past an edge or other handhold, you can try to grab it, potentially stopping your fall. You must succeed at your choice of an Acrobatics check or a Reflex save, usually at the Climb DC. If you grab the edge or handhold, you can then Climb up using Athletics.%rCritical Success You grab the edge or handhold, whether or not you have a hand free, typically by using a suitable held item to catch yourself (catching a battle axe on a ledge, for example). You still take damage from the distance fallen so far, but you treat the fall as though it were 30 feet shorter.%rSuccess If you have at least one hand free, you grab the edge or handhold, stopping your fall. You still take damage from the distance fallen so far, but you treat the fall as though it were 20 feet shorter. If you have no hands free, you continue to fall as if you had failed the check.%rCritical Failure You continue to fall, and if you've fallen 20 feet or more before you use this reaction, you take 10 bludgeoning damage from the impact for every 20 feet fallen."
  "Graceful Poise":
