    description: "You attempt an Athletics check to move a maximum distance of 10 feet through water. The GM determines the DC based on the turbulence or danger of the water; in most instances of calm water, you get an automatic critical success. If your land Speed is 40 feet or higher, increase the maximum possible distance by 5 feet for every 20 feet of Speed above 20 feet.%rIf you end your turn in water and haven't succeeded at a Swim action that turn, you sink 10 feet or get moved by the current, as determined by the GM. This doesn't apply if your last action on your turn was to enter the water.%rCritical Success You move through the water, increasing the maximum distance by 5 feet.%rSuccess You move through the water.%rCritical Failure You make no progress. If you're holding your breath, you lose 1 round of air.%rSample Swim Tasks Untrained lake or other still water%rTrained flowing water, like a river%rExpert swiftly flowing river%rMaster stormy sea%rLegendary maelstrom, waterfall"
