    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "move"]
    check: {"slug": "squeeze", "statistic": "acrobatics", "options": ["action:squeeze"], "notes": {"criticalSuccess": "You squeeze through the tight space in 1 minute per 10 feet of squeezing.", "success": "You squeeze through in 1 minute per 5 feet.", "criticalFailure": "You become stuck in the tight space. While you're stuck, you can spend 1 minute attempting another Acrobatics check at the same DC. Any result on that check other than a critical failure causes you to become unstuck."}}
