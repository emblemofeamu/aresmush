    description: "You watch or study an NPC to learn more about that NPC's preferences. Attempt a Perception check or an appropriate skill check determined by the GM. The DC is found in the NPC's influence stat block.%rCritical Success Choose two of the options detailed in Success below; you can choose the same option twice to learn two pieces of information from the same category.%rSuccess Choose one of the following: You learn which skill that can Influence the NPC has the lowest DC (skipping any skills that you already know), one of the NPC's personal biases, one of the NPC's resistances, or one of the NPC's weaknesses.%rFailure You learn no information.%rCritical Failure Choose a piece of information to learn about, as success, but the information is incorrect."
