    check: {"slug": "feint", "statistic": "deception", "options": ["action:feint"], "against": "perception", "notes": {"criticalSuccess": "You throw your enemy's defenses against you entirely off. The target is Off-Guard against melee attacks that you attempt against it until the end of your next turn.", "success": "Your foe is fooled, but only momentarily. The target is Off-Guard against the next melee attack that you attempt against it before the end of your current turn.", "criticalFailure": "Your feint backfires. You are Off-Guard against melee attacks the target attempts against you until the end of your next turn."}}
