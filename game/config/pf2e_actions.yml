    cost: 1
    category: "defensive"
    traits: ["move", "secret"]
    check: {"slug": "sneak", "statistic": "stealth", "options": ["action:sneak"], "against": "perception", "notes": {"criticalSuccess": "You're undetected by the creature during your movement and remain undetected by the creature at the end of it.", "success": "You're undetected by the creature during your movement and remain undetected by the creature at the end of it.", "failure": "A telltale sound or other sign gives your position away, though you still remain unseen. You're hidden from the creature throughout your movement and remain so.", "criticalFailure": "You're spotted! You're observed by the creature throughout your movement and remain so. If you're invisible and were hidden from the creature, instead of being observed you're hidden throughout your movement and remain so."}}
    description: "You attempt to move to another place while becoming or staying undetected. Stride up to half your Speed. (You can use Sneak while Burrowing, Climbing, Flying, or Swimming instead of Striding if you have the corresponding movement type; you must move at half that Speed.)%rAt the end of your movement, the GM rolls your sneak check in secret and compares the result to the Perception DC of each creature you were Hidden from or Undetected by at the start of your movement. If you have cover or greater cover from the creature throughout your Stride, you gain the +2 circumstance bonus from cover (or +4 from greater cover) to your Stealth check. Because you're moving, the bonus increase from Taking Cover doesn't apply. You don't get to roll against a creature if, at the end of your movement, you neither are Concealed from it nor have cover or greater cover against it. You automatically become observed by such a creature.%rSuccess You're undetected by the creature during your movement and remain undetected by the creature at the end of it.%rYou become observed as soon as you do anything other than Hide, Sneak, or Step. If you attempt to Strike a creature, the creature remains Off-Guard…"
