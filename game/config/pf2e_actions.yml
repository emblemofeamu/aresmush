    description: "Trigger An enemy in your champion's aura damages you%rEffect Bloodshed begets bloodshed as you drag your enemy toward oblivion. You increase the amount of damage you take by 1d6 (2d6 at 5th level, 3d6 at 9th level, 4d6 at 12th level, 5d6 at 16th level, 6d6 at 19th level), and you deal 1d6 (2d6 at 5th level, 3d6 at 9th level, 4d6 at 12th level, 5d6 at 16th level, 6d6 at 19th level) spirit damage to the triggering enemy. The damage you take and deal when you use this reaction increases to 2d6 at 5th level, 3d6 at 9th level, 4d6 at 12th level, 5d6 at 16th level, and 6d6 at 19th level.%rIn addition, until the end of your next turn, your Strikes against the triggering creature deal 2 extra spirit damage. This extra damage increases to 4 at 9th level and 6 at 16th level.%rEffect: Champion's Extra Damage"
  "Detect Magic":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You cast Detect Magic at regular intervals. You move at half your travel speed or slower. You have no chance of accidentally overlooking a magic aura at a travel speed up to 300 feet per minute, but must be traveling no more than 150 feet per minute to detect magic auras before the party moves into them."
  "Determination":
    from: "feat"
