    traits: ["exploration", "secret"]
    check: {"slug": "sense-direction", "statistic": "survival", "options": ["action:sense-direction"], "modifiers": [{"label": "No Compass", "value": -2, "type": "item", "predicate": [{"not": "compass-in-possession"}]}], "notes": {"criticalSuccess": "You get an excellent sense of where you are. If you are in an environment with cardinal directions, you know them exactly.", "success": "You gain enough orientation to avoid becoming hopelessly lost. If you are in an environment with cardinal directions, you have a sense of those directions."}}
    description: "Using the stars, the position of the sun, traits of the geography or flora, or the behavior of fauna, you can stay oriented in the wild. Typically, you attempt a Survival check only once per day, but some environments or changes might necessitate rolling more often. The GM determines the DC and how long this activity takes (usually just a minute or so). More unusual locales or those you're unfamiliar with might require you to have a minimum proficiency rank to Sense Direction. Without a Compass, you take a –2 item penalty to checks to Sense Direction.%rCritical Success You get an excellent sense of where you are. If you are in an environment with cardinal directions, you know them exactly.%rSuccess You gain enough orientation to avoid becoming hopelessly lost. If you are in an environment with cardinal directions, you have a sense of those directions.%rSense Direction Tasks Untrained determine a cardinal direction using the sun Trained find an overgrown path in a forest Expert navigate a hedge maze Master navigate a byzantine labyrinth or relatively featureless desert Legendary navigate an ever-changing dream realm"
  "Sense Motive":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["concentrate", "secret"]
    check: {"slug": "sense-motive", "statistic": "perception", "options": ["action:sense-motive"], "against": "deception", "notes": {"criticalSuccess": "You determine the creature's true intentions and get a solid idea of any mental magic affecting it.", "success": "You can tell whether the creature is behaving normally, but you don't know its exact intentions or what magic might be affecting it.", "failure": "You detect what a deceptive creature wants you to believe. If they're not being deceptive, you believe they're behaving normally.", "criticalFailure": "You get a false sense of the creature's intentions."}}
    description: "You try to tell whether a creature's behavior is abnormal. Choose one creature and assess it for odd body language, signs of nervousness, and other indicators that it might be trying to deceive someone. The GM attempts a single secret Perception check for you and compares the result to the Deception DC of the creature, the DC of a spell affecting the creature's mental state, or another appropriate DC determined by the GM. You typically can't try to Sense the Motive of the same creature again until the situation changes significantly.%rCritical Success You determine the creature's true intentions and get a solid idea of any mental magic affecting it.%rSuccess You can tell whether the creature is behaving normally, but you don't know its exact intentions or what magic might be affecting it.%rFailure You detect what a deceptive creature wants you to believe. If they're not being deceptive, you believe they're behaving normally.%rCritical Failure You get a false sense of the creature's intentions."
