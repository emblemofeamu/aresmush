  "Hide":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["secret"]
    check: {"slug": "hide", "statistic": "stealth", "options": ["action:hide"], "against": "perception", "notes": {"criticalSuccess": "If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition.", "success": "If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition."}}
    description: "You huddle behind cover or greater cover or deeper into concealment to become Hidden, rather than Observed. The GM rolls your Stealth check in secret and compares the result to the Perception DC of each creature you're observed by but that you have cover or greater cover against or are Concealed from. You get a +2 circumstance bonus to your check if you have standard cover (or +4 from greater cover).%rSuccess If the creature could see you, you're now Hidden from it instead of observed. If you were hidden from or Undetected by the creature, you retain that condition.%rIf you successfully become hidden to a creature but then cease to have cover or greater cover against it or be concealed from it, you become observed again. You cease being hidden if you do anything except Hide, Sneak, or Step. If you attempt to Strike a creature, the creature remains off-guard against that attack, and you then become observed. If you do anything else, you become observed just before you act unless the GM determines otherwise. The GM might allow you to perform a particularly unobtrusive action without being noticed, possibly requiring another Stealth check.%rIf a creature uses Seek to make you…"
  "High Jump":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 2
    category: "interaction"
    traits: ["move"]
    check: {"slug": "high-jump", "statistic": "athletics", "options": ["action:high-jump", "action:stride", "action:leap"], "dc": 30, "notes": {"criticalSuccess": "You Leap up to 8 feet vertically and 10 feet horizontally.", "success": "You Leap up to 5 feet vertically and 5 feet horizontally.", "failure": "You Leap normally.", "criticalFailure": "You fall Prone in your space."}}
    description: "You Stride, then attempt a DC 30 Athletics check to jump vertically. If you didn't Stride at least 10 feet, you automatically fail. This DC might be increased or decreased due to the situation, as determined by the GM.%rCritical Success You Leap up to 8 feet vertically and 10 feet horizontally.%rSuccess You Leap up to 5 feet vertically and 5 feet horizontally.%rFailure You Leap normally.%rCritical Failure You fall Prone in your space."
  "Hone Claws":
