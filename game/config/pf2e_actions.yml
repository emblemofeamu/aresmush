    traits: ["barbarian"]
    self_effect: "Effect: Rage"
    description: "Trigger You roll initiative.%rRequirements You are not Encumbered or wearing heavy armor.%rSo long as you are able to move freely, your fury is instinctive and instantaneous. You Rage."
    rules:
      - key: "Note"
        selector: "initiative"
        title: "{item|name} F"
        text: "{item|description}Effect: RageEffect: Rage Temporary Hit Points Immunity"
        predicate: [{"not": "condition:encumbered"}, {"or": ["feat:invulnerable-rager", {"not": "armor:category:heavy"}]}]
        effects: ["Effect: Rage", "Effect: Rage Temporary Hit Points Immunity"]
  "Quickened Casting":
    from: "feat"
    type: "free"
