    traits: ["dwarf"]
  "Mark for Death":
    from: "action"
    source: "Pathfinder Player Core 2"
    for: "archetype"
    type: "action"
    cost: 3
    category: "offensive"
    traits: ["concentrate"]
    description: "Requirements The creature you intend to mark is observed by you%rEffect You designate a single creature as your mark. Using Mark for Death while Hidden or Undetected doesn't make you Observed. Mark for Death lasts until the mark dies or you use Mark for Death again. You gain a +2 circumstance bonus to Perception checks to Seek your mark, as well as to Deception checks to Feint against your mark. Your mark takes a –2 circumstance penalty to all Perception checks to Seek you.%rIn addition, when attacking your mark, you have the Sneak Attack class feature, except it deals 1d4 precision damage and you don't increase the number of dice as you gain levels. At 6th level, the damage increases to 1d6. If you already have the sneak attack class feature, you instead deal an additional 1 precision damage with your sneak attacks made against your mark, increasing to 2 precision damage at 6th level."
    rules:
      - key: "RollOption"
        option: "marked-for-death"
        toggleable: true
        label: "Target is Marked for Death"
      - key: "FlatModifier"
        selector: ["perception", "deception"]
        type: "circumstance"
        value: 2
        slug: "mark-for-death-skill"
        label: "Target is Marked for Death"
        predicate: ["marked-for-death", {"or": ["action:feint", "action:seek"]}]
      - key: "DamageDice"
        category: "precision"
        selector: "strike-damage"
        diceNumber: "1"
        dieSize: "d4"
        slug: "sneak-attack"
        predicate: [{"not": "feature:sneak-attack"}, "marked-for-death", "target:condition:off-guard", {"or": ["item:trait:agile", "item:trait:finesse", {"and": ["item:ranged", {"not": "item:thrown-melee"}]}]}]
      - key: "DamageAlteration"
        property: "dice-faces"
        mode: "upgrade"
        selectors: ["strike-damage"]
        value: 6
        predicate: ["dice:slug:sneak-attack", {"not": "feature:sneak-attack"}, {"gte": ["self:level", 6]}]
      - key: "FlatModifier"
        selector: "strike-damage"
        value: "ternary(gte(@actor.level,6),2,1)"
        damageCategory: "precision"
        slug: "mark-for-death-damage"
        predicate: ["marked-for-death", "feature:sneak-attack", "target:condition:off-guard", "item:tag:sneak-attack"]
