    traits: ["exploration", "move"]
    description: "You strain yourself to move at double your travel speed. You can Hustle only for a number of minutes equal to your Constitution modifier × 10 (minimum 10 minutes). If you are in a group that is Hustling, use the lowest Constitution modifier among everyone to determine how fast the group can Hustle together."
  "Identify Alchemy":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "secret"]
    check: {"slug": "identify-alchemy", "statistic": "crafting", "options": ["action:identify-alchemy"], "notes": {"criticalSuccess": "You identify the item and the means of activating it.", "success": "You identify the item and the means of activating it.", "failure": "You fail to identify the item but can try again.", "criticalFailure": "You misidentify the item as another item of the GM's choice."}}
    description: "Requirements You're holding or wearing an Alchemist's Toolkit.%rYou can identify the nature of an alchemical item with 10 minutes of testing using alchemist's toolkit. If your attempt is interrupted in any way, you must start over.%rSuccess You identify the item and the means of activating it.%rFailure You fail to identify the item but can try again.%rCritical Failure You misidentify the item as another item of the GM's choice."
  "Identify Magic":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "secret"]
    check: {"slug": "identify-magic", "statistic": ["arcana", "nature", "occultism", "religion"], "options": ["action:identify-magic"], "notes": {"criticalSuccess": "You learn all the attributes of the magic, including its name (for an effect), what it does, any means of activating it (for an item or location), and whether it is cursed.", "success": "For an item or location, you get a sense of what it does and learn any means of activating it. For an ongoing effect (such as a spell with a duration), you learn the effect's name and what it does. You can't try again in hopes of getting a critical success.", "failure": "You fail to identify the magic and can't try again for 1 day.", "criticalFailure": "You misidentify the magic as something else of the GM's choice."}}
    description: "Once you discover that an item, location, or ongoing effect is magical, you can spend 10 minutes to try to identify the particulars of its magic. If your attempt is interrupted, you must start over. The GM sets the DC for your check. Cursed magic or esoteric subjects usually have higher DCs or might even be impossible to identify using this activity alone. Heightening a spell doesn't increase the DC to identify it.%rCritical Success You learn all the attributes of the magic, including its name (for an effect), what it does, any means of activating it (for an item or location), and whether it is cursed.%rSuccess For an item or location, you get a sense of what it does and learn any means of activating it. For an ongoing effect (such as a spell with a duration), you learn the effect's name and what it does. You can't try again in hopes of getting a critical success.%rFailure You fail to identify the magic and can't try again for 1 day.%rCritical Failure You misidentify the magic as something else of the GM's choice."
