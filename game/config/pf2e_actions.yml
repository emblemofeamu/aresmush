  "Drive":
    from: "action"
    source: "Pathfinder GM Core"
    for: "vehicles"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["move"]
    check: {"slug": "drive", "statistic": "piloting", "options": ["action:drive", "action:drive"], "variants": {"drive1": {"name": "Drive1", "notes": {"criticalSuccess": "The vehicle moves up to its Speed and can turn normally.", "success": "The vehicle moves up to its Speed and can turn normally.", "failure": "The vehicle moves its Speed in a straight line.", "criticalFailure": "The vehicle moves its Speed in a straight line and becomes uncontrolled."}}, "drive2": {"name": "Drive2", "notes": {"criticalSuccess": "The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.", "success": "The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.", "failure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled.", "criticalFailure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled."}}, "drive3": {"name": "Drive3", "notes": {"criticalSuccess": "The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading.", "success": "The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading.", "failure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled.", "criticalFailure": "The vehicle moves its Speed in a straight line along its most recent heading, drifting up to 45 degrees at the GM's discretion, and becomes uncontrolled."}}}}
    description: "Requirements You are piloting a vehicle.%rYou pilot your vehicle to move. Decide how many actions you intend to spend before you begin Driving. The effects depend on the number of actions you spend. You can't Drive through spaces occupied by creatures, even if they are allies.%r1 Attempt a piloting check. On a success, the vehicle moves up to its Speed and can turn normally. On a failure, the vehicle moves its Speed in a straight line. On a critical failure, the vehicle moves its Speed in a straight line and becomes uncontrolled%r2 (reckless) The vehicle moves up to twice its Speed in a straight line at the vehicle's current heading.%r3 (reckless) You take a –5 penalty on your piloting check to maintain control of the vehicle. The vehicle moves up to three times its Speed in a straight line at the vehicle's current heading."
