    category: "interaction"
    traits: ["downtime", "secret"]
    description: "You spend time observing the place or group you wish to infiltrate. Attempt a normal, hard, or very hard DC Perception, Society or Stealth check.%rSuccess You make observations that provide 1 EP.%rFailure You learn nothing particularly noteworthy.%rCritical Failure You misjudge some aspect of what you observed, gaining 1 EP that results in a critical failure instead of a success when used, even if a PC uses the Edge Point after rolling a failure."
  "Scout's Warning":
