    check: {"slug": "take-control", "statistic": "piloting", "options": ["action:take-control", "action:take-control"], "notes": {"criticalSuccess": "You become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled.", "success": "You become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled."}}
    description: "Requirements You are aboard the vehicle and adjacent to its controls.%rYou grab the reins, the wheel, or some other mechanism to control the vehicle. Attempt a piloting check; on a success, you become the vehicle's pilot, or regain control of the vehicle if it was uncontrolled. Some vehicles have complicated controls that cause this action to become a multi-action activity."
  "Take Cover":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: []
    self_effect: "Effect: Cover"
    description: "Requirements You are benefiting from standard cover, are near a feature that allows you to take cover, or are Prone.%rYou press yourself against a wall or duck behind an obstacle to take better advantage of cover. If you would have standard cover, you instead gain greater cover, which provides a +4 circumstance bonus to AC; to Reflex saves against area effects; and to Stealth checks to hide, sneak, or otherwise avoid detection. Otherwise, you gain standard cover (a +2 circumstance bonus instead). If you're prone, you gain greater cover against ranged attacks. Take Cover lasts until you move from your current space, use an attack action, become Unconscious, or end it as a free action."
