    traits: ["champion", "divine"]
    description: "Trigger An enemy damages your ally, and both are in your champion's aura%rEffect Your enemy hesitates under the weight of sin as visions of redemption play in their mind's eye. The enemy must choose to repent or refuse, with the following effects. If the enemy is mindless or otherwise unable to repent, use the refuse result.%rRepent The ally is unharmed by the triggering damage.%rRefuse The ally gains resistance to all damage against the triggering damage equal to 2 + your level. After the damaging effect is applied, the enemy becomes Enfeebled 2 until the end of its next turn.%rEffect: Champion's Resistance"
