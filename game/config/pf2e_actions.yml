  "Repair":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["exploration", "manipulate"]
    check: {"slug": "repair", "statistic": "crafting", "options": ["action:repair"], "notes": {"criticalSuccess": "You restore 10 Hit Points to the item, plus an additional 10 Hit Points per proficiency rank you have in Crafting (a total of 20 HP if you're trained, 30 HP if you're an expert, 40 HP if you're a master, or 50 HP if you're legendary).", "success": "You restore 5 Hit Points to the item, plus an additional 5 per proficiency rank you have in Crafting (for a total of 10 HP if you are trained, 15 HP if you're an expert, 20 HP if you're a master, or 25 HP if you're legendary).", "criticalFailure": "You deal 2d6 damage to the item. Apply the item's Hardness to this damage."}}
    description: "Requirements You are holding or wearing a Repair Kit%rYou spend 10 minutes attempting to fix a damaged item, placing the item on a stable surface and using the repair kit with both hands. The GM sets the DC, but it's usually about the same DC to Repair a given item as it is to Craft it in the first place. You can't Repair a destroyed item.%rCritical Success You restore 10 Hit Points to the item, plus an additional 10 Hit Points per proficiency rank you have in Crafting (a total of 20 HP if you're trained, 30 HP if you're an expert, 40 HP if you're a master, or 50 HP if you're legendary).%rSuccess You restore 5 Hit Points to the item, plus an additional 5 per proficiency rank you have in Crafting (for a total of 10 HP if you are trained, 15 HP if you're an expert, 20 HP if you're a master, or 25 HP if you're legendary).%rCritical Failure You deal 2d6 damage to the item. Apply the item's Hardness to this damage."
  "Repeat a Spell":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You repeatedly cast the same spell while moving at half speed. Typically, this spell is a cantrip that you want to have in effect in the event a combat breaks out, and it must be one you can cast in 2 actions or fewer. Repeating a spell that requires making complex decisions, such as Figment, can make you Fatigued, as determined by the GM."
  "Reposition":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["attack"]
    check: {"slug": "reposition", "statistic": "athletics", "options": ["action:reposition", "forced-movement"], "against": "fortitude", "notes": {"criticalSuccess": "You move the creature up to 10 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.", "success": "You move the target up to 5 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.", "criticalFailure": "The target can move you up to 5 feet as though it successfully Repositioned you."}}
    description: "Requirements You either have at least one hand free, or you're grabbing or restraining the target. The target can't be more than one size larger than you.%rYou muscle a creature or object around. Attempt an Athletics check against the target's Fortitude DC.%rCritical Success You move the creature up to 10 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.%rSuccess You move the target up to 5 feet. It must remain within your reach during this movement, and you can't move it into or through obstacles.%rCritical Failure The target can move you up to 5 feet as though it successfully Repositioned you."
  "Request":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate", "linguistic", "mental"]
    check: {"slug": "request", "statistic": "diplomacy", "options": ["action:request"], "notes": {"criticalSuccess": "The target agrees to your request without qualifications.", "success": "The target agrees to your request, but they might demand added provisions or alterations to the request.", "failure": "The target refuses the request, though they might propose an alternative that is less extreme.", "criticalFailure": "Not only does the target refuse the request, but their attitude toward you decreases by one step due to the temerity of the request."}}
    description: "You can make a request of a creature that's friendly or helpful to you. You must couch the request in terms that the target would accept given their current attitude toward you. The GM sets the DC of the Diplomacy check based on the difficulty of the request. Some requests are unsavory or impossible, and even a helpful NPC would never agree to them.%rCritical Success The target agrees to your request without qualifications.%rSuccess The target agrees to your request, but they might demand added provisions or alterations to the request.%rFailure The target refuses the request, though they might propose an alternative that is less extreme.%rCritical Failure Not only does the target refuse the request, but their attitude toward you decreases by one step due to the temerity of the request."
  "Research":
    from: "action"
