  "Command an Animal":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["auditory", "concentrate"]
    check: {"slug": "command-an-animal", "statistic": "nature", "options": ["action:command-an-animal"], "against": "will", "notes": {"criticalSuccess": "The animal does as you command on its next turn.", "success": "The animal does as you command on its next turn.", "failure": "The animal is hesitant or resistant, and it does nothing.", "criticalFailure": "The animal misbehaves or misunderstands, and it takes some other action determined by the GM."}}
    description: "You issue an order to an animal. Attempt a Nature check against the animal's Will DC. The GM might adjust the DC if the animal has a good attitude toward you, you suggest a course of action it was predisposed toward, or you offer it a treat.%rYou automatically fail if the animal is hostile or unfriendly to you. If the animal is helpful to you, increase your degree of success by one step. You might be able to Command an Animal more easily with a feat like Ride.%rMost animals know the Drop Prone, Leap, Seek, Stand, Stride, and Strike basic actions. If an animal knows an activity, such as a horse's Gallop, you can Command the Animal to perform the activity, but you must spend as many actions on Command an Animal as the activity's number of actions. You can also spend multiple actions to Command the Animal to perform that number of basic actions on its next turn; for instance, you could spend 3 actions to Command an Animal to Stride three times or to Stride twice and then make a Strike.%rSuccess The animal does as you command on its next turn.%rFailure The animal is hesitant or resistant, and it does nothing.%rCritical Failure The animal misbehaves or misunderstands, and it takes some…"
  "Conceal Spell":
    from: "feat"
