    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "passive"
    category: "interaction"
    traits: ["downtime"]
    check: {"slug": "subsist", "statistic": ["society", "survival"], "options": ["action:subsist"], "modifiers": [{"label": "After Exploration", "value": -5, "type": "untyped", "predicate": ["action:subsist:after-exploration"]}], "notes": {"criticalSuccess": "You either provide a subsistence living for yourself and one additional creature, or you improve your own food and shelter, granting yourself a comfortable living.", "success": "You find enough food and shelter with basic protection from the elements to provide you a subsistence living.", "failure": "You're exposed to the elements and don't get enough food, becoming Fatigued until you attain sufficient food and shelter.", "criticalFailure": "You attract trouble, eat something you shouldn't, or otherwise worsen your situation. You take a –2 circumstance penalty to checks to Subsist for 1 week. You don't find any food at all; if you don't have any stored up, you're in danger of starving or dying of thirst if you continue failing. Effect: Adverse Subsist Situation"}}
    description: "You try to provide food and shelter for yourself, and possibly others as well, with a standard of living. This typically uses Society if you're in a settlement or Survival if you're in the wild. The GM determines the DC based on the nature of the place where you're trying to Subsist. You might need a minimum proficiency rank to Subsist in particularly strange environments. Unlike most downtime activities, you can Subsist after 8 hours or less of exploration, but if you do, you take a –5 penalty.%rSample Subsist Tasks Untrained a lush forest with calm weather or a large city with plentiful resources Trained typical hillside or village Expert typical mountains or insular hamlet Master typical desert or city under siege Legendary barren wasteland or city of undead%rCritical Success You either provide a subsistence living for yourself and one additional creature, or you improve your own food and shelter, granting yourself a comfortable living.%rSuccess You find enough food and shelter with basic protection from the elements to provide you a subsistence living.%rFailure You're exposed to the elements and don't get enough food, becoming Fatigued until you attain sufficient food and…"
