    description: "Trigger An enemy in your champion's aura damages you%rEffect Your self-interest keeps you safe. You gain resistance against the triggering damage equal to 2 + half your level, regardless of damage type.%rEffect: Selfish Shield%rIn addition, your Strikes against the triggering creature deal 1 extra spirit damage until the end of your next turn. This extra damage increases to 2 at 9th level and 3 at 16th level.%rEffect: Champion's Extra Damage"
  "Sense Direction":
