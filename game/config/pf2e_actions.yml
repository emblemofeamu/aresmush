  "Grapple":
    from: "action"
    source: "Pathfinder Player Core"
    for: "everyone"
    type: "action"
    cost: 1
    category: "interaction"
    traits: ["attack"]
    check: {"slug": "grapple", "statistic": "athletics", "options": ["action:grapple"], "against": "fortitude", "weapon_traits": ["grapple"], "notes": {"criticalSuccess": "Your target is Restrained until the end of your next turn unless you move or your target Escapes.", "success": "Your target is Grabbed until the end of your next turn unless you move or your target Escapes.", "failure": "You fail to grab your target. If you already had the target Grabbed or Restrained using a Grapple, those conditions on the target end.", "criticalFailure": "If you already had the target Grabbed or Restrained, it breaks free. Your target can either grab you, as if it succeeded at using the Grapple action against you, or force you to fall and land Prone."}}
    description: "Requirements You have at least one free hand and your target is no more than one size larger than you.%rYou attempt to grab a creature or object with your free hand. Attempt an Athletics check against the target's Fortitude DC. You can grapple a target you already have Grabbed or Restrained without having a hand free.%rCritical Success Your target is restrained until the end of your next turn unless you move or your target Escapes.%rSuccess Your target is grabbed until the end of your next turn unless you move or your target Escapes.%rFailure You fail to grab your target. If you already had the target grabbed or restrained using a Grapple, those conditions on the target end.%rCritical Failure If you already had the target grabbed or restrained, it breaks free. Your target can either grab you, as if it succeeded at using the Grapple action against you, or force you to fall and land Prone."
