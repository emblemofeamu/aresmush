    category: "interaction"
    traits: ["concentrate", "exploration"]
    description: "You comb through information to learn more about the topic at hand. Choose your research topic, section of the library, or other division depending on the form of research, and attempt a skill check. The skills to use and the DC for the check depend on the specific research task, and the Research activity gains any traits appropriate to the type of research (such as linguistic when perusing books).%rCritical Success You gain 2 RP.%rSuccess You gain 1 RP.%rCritical Failure You make a false discovery and lose 1 RP."
