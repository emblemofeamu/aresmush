  "Pursue a Lead":
    from: "action"
    source: "Pathfinder Player Core 2"
    for: "class"
    type: "passive"
    category: "interaction"
    traits: ["concentrate", "exploration", "investigator"]
    frequency: {"max": 1, "per": "PT10M"}
    description: "Frequency once per 10 minutes%rYou name one detail you've identified that you think is part of a larger mystery, then spend 1 minute examining it. The detail is typically either obvious or something you've already discovered using Recall Knowledge, Sense Motive, Gather Information, or a similar action. After the minute passes, the GM either confirms there's a larger mystery or tells you there's nothing more to learn (the detail is inconsequential or you know all the information already). If there is in fact a larger mystery at play, you can't Pursue a Lead again for 10 minutes, but you can choose to open an investigation. To do so, define the question at the heart of the mystery, such as \"Where has the priceless work of art that was supposed to hang here been taken?\" or \"Who or what killed this priest?\" Work with your GM to refine the question if need be. You can also give your investigation a name to better keep track of it (such as \"The Case of the Cheated Goblin\" or \"The Skinsaw Murders\").%rInvestigation Bonus Whenever you attempt a Perception check or skill check to attempt to get closer to answering the question at the heart of an active investigation, you gain a +1…"
    rules:
      - key: "RollOption"
        option: "pursue-a-lead"
        toggleable: true
        label: "Pursue a Lead \u2014 Investigation Bonus"
      - key: "FlatModifier"
        selector: ["perception", "skill-check"]
        type: "circumstance"
        value: 1
        slug: "pursue-a-lead"
        predicate: ["pursue-a-lead"]
