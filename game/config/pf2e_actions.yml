  "Confident Finisher":
    from: "action"
    source: "Pathfinder Player Core 2"
    for: "class"
    type: "action"
    cost: 1
    category: "offensive"
    traits: ["finisher"]
    strikes: {"count": 1}
    description: "You make an incredibly graceful attack, piercing your foe's defenses. Make a Strike with the following failure effect.%rFailure You deal half your Precise Strike damage to the target. This damage type is that of the weapon or unarmed attack you used for the Strike."
    rules:
      - key: "RollOption"
        option: "finisher"
        toggleable: true
        suboptions: [{"label": "Confident", "value": "confident"}]
        disabledIf: [{"not": "self:effect:panache"}]
        disabledValue: false
        label: "Finisher"
      - key: "Note"
        selector: "strike-attack-roll"
        outcome: ["failure"]
        title: "{item|name}"
        text: "You deal half your Precise Strike damage to the target. This damage type is that of the weapon or unarmed attack you used for the Strike."
        predicate: [{"or": ["finisher:confident", "eternal-confidence"]}, {"or": ["item:melee", {"and": ["feat:flying-blade", "item:thrown", {"or": ["target:range-increment:1", {"and": ["finisher:twirling-throw", {"lte": ["target:range-increment", 3]}]}]}]}]}, {"or": ["item:trait:agile", "item:trait:finesse"]}, {"not": "feat:precise-finisher"}]
